# Publish the browser converter (web/index.html) to GitHub Pages.
# The page runs the repository's own Python package with Pyodide, so the site
# is the page plus the modules it loads. Tests run first; a red build publishes
# nothing.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "autocalendar/**", "tests/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python -m unittest discover -s tests
      - name: Assemble the site
        run: |
          mkdir -p _site/autocalendar
          cp web/index.html _site/
          for m in __init__ model parsing reader ics timezones cli sheet_export formatting; do
            cp "autocalendar/$m.py" _site/autocalendar/
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
