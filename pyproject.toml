[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocalendar"
version = "0.1.0"
description = "Turn a spreadsheet of sessions into an .ics calendar file"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["openpyxl>=3.1"]

[project.scripts]
autocalendar = "autocalendar.cli:main"

[tool.setuptools]
packages = ["autocalendar"]
